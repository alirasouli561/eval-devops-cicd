name: CI - HTML Validation

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  html-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: HTML5 validation
        uses: Cyb3r-Jak3/html5validator-action@v7.2.0
        with:
          root: .
