name: CD - Deploy to Self-Hosted Runner

on:
  workflow_run:
    workflows: ["CI - HTML Validation"]
    types: [completed]

jobs:
  deploy-runner:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Nginx web root
        run: |
          set -e
          sudo rsync -av --delete ./ /var/www/eval-site/
          sudo nginx -t
          sudo systemctl reload nginx

      - name: Verify local
        run: |
          curl -I http://localhost | head -n 1
